<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Конкурсы</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">

</head>

<body>

<header class="page-header">

<p>Лучшие работы наших маленьких участников.</p>

</header>

<section class="contest-grid">

<div class="contest-card winner">

<img src="assets/images/contest-placeholder.png" alt="1 место">

<span class="place gold">🥇 1 место</span>

<h2>Иван Петров</h2>

<p>«Мой любимый герой»</p>

<button>Посмотреть работу</button>

</div>

<div class="contest-card">

<img src="assets/images/contest-placeholder.png" alt="2 место">

<span class="place silver">🥈 2 место</span>

<h2>Мария Иванова</h2>

<p>«Весёлый лес»</p>

<button>Посмотреть работу</button>

</div>

<div class="contest-card">

<img src="assets/images/contest-placeholder.png" alt="3 место">

<span class="place bronze">🥉 3 место</span>

<h2>Алексей Смирнов</h2>

<p>«Моя семья»</p>

<button>Посмотреть работу</button>

</div>

</section>

<script src="js/main.js"></script>
