<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="auth-container">

    <form id="registerForm" class="auth-form">

        <h1>Регистрация</h1>

        <input
            type="text"
            id="name"
            placeholder="Имя"
            required>

        <input
            type="email"
            id="email"
            placeholder="Почта"
            required>

        <input
            type="password"
            id="password"
            placeholder="Пароль"
            required>

        <button type="submit">

            Зарегистрироваться

        </button>

        <p>

            Уже есть аккаунт?

            <a href="login.html">

                Войти

            </a>

        </p>

    </form>

</div>

<script src="js/auth.js"></script>

<script>

document
.getElementById("registerForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const name =
    document.getElementById("name").value;

    const email =
    document.getElementById("email").value;

    login(name,email);

});

</script>

</body>

</html>
